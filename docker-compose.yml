services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cloud_file_storage
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cloud_file_storage
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      STORAGE_PATH: storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data: